# 실시간 웨딩 소식: 3시간마다 네이버 뉴스에서 웨딩·스드메 기사를 모아 data/news.json 갱신
name: 실시간 웨딩 소식 업데이트

on:
  schedule:
    - cron: '17 */3 * * *'   # 3시간마다 (정각 혼잡을 피해 17분에 실행, UTC 기준)
  workflow_dispatch:          # Actions 탭에서 'Run workflow'로 바로 실행 가능
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-news.mjs'
      - '.github/workflows/update-news.yml'

permissions:
  contents: write   # data/news.json 커밋
  pages: write      # GitHub Pages 다시 배포 요청

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # 네트워크 문제로 멈추면 5분 뒤 자동 종료
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 네이버 뉴스에서 웨딩 기사 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node scripts/fetch-news.mjs

      - name: 바뀐 기사 목록 저장 (커밋)
        id: commit
        run: |
          if git ls-files --error-unmatch data/news.json >/dev/null 2>&1 && git diff --quiet -- data/news.json; then
            echo "기사 목록 변경 없음"
            exit 0
          fi
          git config user.name "marryst-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore: 실시간 웨딩 소식 업데이트"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # 봇이 올린 커밋은 GitHub Pages 자동 배포가 생략될 수 있어 직접 요청 (Cloudflare는 자동 배포)
      - name: GitHub Pages 다시 배포 요청
        if: steps.commit.outputs.pushed == 'true'
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "Pages 재배포 요청 실패 (다음 push 때 반영됩니다)"
